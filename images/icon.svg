<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 외부 그라디언트 호 (Cyan -> Sky Blue -> Violet/Magenta) -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- 배경 미세 테두리/그라디언트 -->
    <linearGradient id="bgBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <!-- 배경 둥근 사각형 -->
  <rect x="4" y="4" width="504" height="504" rx="110" ry="110" fill="#080c16" stroke="url(#bgBorder)" stroke-width="3" />

  <!-- 중심점: (256, 246), 반지름: 154 기준 궤도 시스템 -->
  <g id="orbit-system">
    <!-- 1. 내부 점선 원 (대시 궤도) -->
    <circle cx="256" cy="246" r="144" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-dasharray="8 12" stroke-linecap="round" />

    <!-- 2. 우측 상단 하늘색 위성/원형 포인트 -->
    <circle cx="383" cy="130" r="14" fill="#38bdf8" />

    <!-- 3. 하단~좌우를 감싸는 그라디언트 아크 (호) -->
    <!-- 약 155도 각도에서 시작하여 아래를 지나 약 18도 각도까지 이어지는 패스 -->
    <path d="M 97 174 A 176 176 0 1 0 436 268" fill="none" stroke="url(#arcGrad)" stroke-width="13" stroke-linecap="round" />
  </g>

  <!-- 4. 텍스트 그룹 -->
  <g text-anchor="middle" id="text-group">
    <!-- 메인 타이틀: GMM -->
    <text x="256" y="278" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Montserrat&#39;, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-weight="900" font-size="94" letter-spacing="2">GMM</text>

    <!-- 서브 타이틀: GLOBAL MARKET -->
    <text x="256" y="329" fill="#38bdf8" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Montserrat&#39;, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-weight="800" font-size="16.5" letter-spacing="6.8">GLOBAL MARKET</text>
  </g>
</svg>